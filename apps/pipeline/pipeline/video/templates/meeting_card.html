<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=block">
<style>
  :root {
    --teal: #00747a;
    --teal-bright: #3cc4c9;
    --ink: #f6f8f8;
    --ink-soft: rgba(236, 242, 242, 0.84);
    --ink-mute: rgba(214, 226, 226, 0.66);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b1213; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 40%;
    filter: saturate(0.85) contrast(1.02);
  }
  /* No frame: brand gradient instead. */
  .card.no-frame { background: radial-gradient(120% 120% at 100% 0%, #0d5a5e 0%, #0b2426 45%, #0a1314 100%); }
  .mark { display: none; position: absolute; right: -40px; top: 50%; width: 460px; height: 460px; transform: translateY(-50%); opacity: 0.09; }
  .card.no-frame .mark { display: block; }
  .card.no-frame .scrim { display: none; }

  /* Scrim: heavy on the left where text sits, opening up to the right so the room still shows. */
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(6, 13, 14, 0.94) 0%, rgba(6, 13, 14, 0.88) 42%, rgba(6, 13, 14, 0.55) 68%, rgba(6, 13, 14, 0.18) 100%),
      linear-gradient(0deg, rgba(6, 13, 14, 0.7) 0%, rgba(6, 13, 14, 0) 38%);
  }
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--teal-bright); }

  .content {
    position: absolute; inset: 0; padding: 52px 64px 44px 72px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .brand-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.28); margin: 0 4px; }
  .eyebrow {
    font-size: 15px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--teal-bright);
  }

  .main { margin-top: auto; max-width: 780px; }
  .date { font-size: 22px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; }
  .title {
    font-size: 60px; font-weight: 850; line-height: 1.02; letter-spacing: -0.025em;
    text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .title.long { font-size: 48px; }

  .points { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  .points li {
    position: relative; padding-left: 26px;
    font-size: 22px; line-height: 1.32; font-weight: 500; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .points li::before {
    content: ""; position: absolute; left: 2px; top: 0.5em;
    width: 9px; height: 9px; border-radius: 2px; background: var(--teal-bright);
  }
  .points.tight li { -webkit-line-clamp: 1; }

  .foot {
    margin-top: 30px; display: flex; align-items: center; gap: 14px;
    font-size: 17px; font-weight: 600; color: var(--ink-mute);
  }
  .foot .play {
    display: inline-flex; align-items: center; gap: 8px; color: var(--ink);
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    padding: 7px 14px 7px 11px; border-radius: 999px;
  }
  .foot .play svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="frame" id="frame" alt="">
  <div class="scrim"></div>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#7fe3e6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></svg>
  <div class="accent"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#00747a"/><g transform="translate(5 5) scale(0.9167)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></g></svg>
      <span class="brand-name">Open Langford</span>
      <span class="brand-sep"></span>
      <span class="eyebrow" id="eyebrow"></span>
    </div>
    <div class="main">
      <div class="date" id="date"></div>
      <h1 class="title" id="title"></h1>
      <ul class="points" id="points"></ul>
      <div class="foot">
        <span class="play" id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span id="play-label">Watch the meeting</span></span>
        <span>openlangford.ca</span>
      </div>
    </div>
  </div>
</div>
<script id="card-data" type="application/json">{"title":"Regular Council","eyebrow":"Council","date":"Tuesday, May 19, 2026","frame":null,"points":[],"duration":null}</script>
<script>
// Wrapped so re-rendering into the same page (document.write) never redeclares bindings.
(() => {
  const d = JSON.parse(document.getElementById("card-data").textContent);
  const $ = (id) => document.getElementById(id);
  $("title").textContent = d.title;
  if (d.title.length > 34) $("title").classList.add("long");
  $("eyebrow").textContent = d.eyebrow || "";
  $("date").textContent = d.date || "";
  const pts = (d.points || []).slice(0, 3);
  for (const p of pts) { const li = document.createElement("li"); li.textContent = p; $("points").appendChild(li); }
  if (pts.length === 3 && d.title.length > 34) $("points").classList.add("tight");
  if (!pts.length) $("points").remove();
  $("play-label").textContent = d.duration ? `Watch the meeting · ${d.duration}` : "Watch the meeting";
  // The renderer waits for data-ready (fonts loaded and the frame decoded, or failed).
  const fontsReady = document.fonts.ready;
  const frameReady = new Promise((resolve) => {
    if (!d.frame) { $("frame").remove(); $("card").classList.add("no-frame"); return resolve("none"); }
    $("frame").src = d.frame;
    $("frame").decode().then(() => resolve("ok"), () => resolve("error"));
  });
  Promise.all([fontsReady, frameReady]).then(([, frame]) => { document.body.dataset.ready = frame; });
})();
</script>
</body>
</html>
