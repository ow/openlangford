# Inbound mail for openlangford.ca: Cloudflare Email Routing hands every message (catch-all) to this Worker, which
# posts it to a private Discord channel. Receive-only; outgoing mail stays on Resend.
name = "langford-email-router"
account_id = "ec49b1303ded6ef60011350d2912ddf6" # same account as the openlangford.ca zone and the site
main = "src/index.ts"
compatibility_date = "2026-02-10"
# Mail only: no public web address.
workers_dev = false
preview_urls = false

[observability]
enabled = true

# Secrets (wrangler secret put): DISCORD_WEBHOOK_URL, a private channel's webhook, never the public digest channel's;
# optional DISCORD_CONTACT_WEBHOOK_URL, a separate channel for contact@ (the site's contact-form notifications).
# Optional var: FORWARD_TO, a verified Email Routing destination that also gets each message (and every message if
# Discord is down).
