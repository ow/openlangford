name = "langford-intelligence"
account_id = "ec49b1303ded6ef60011350d2912ddf6"
compatibility_date = "2026-02-10"
compatibility_flags = ["nodejs_compat"]
main = "./workers/app.ts"
workers_dev = true
preview_urls = true

[version_metadata]
binding = "CF_VERSION_METADATA"

# Static files (public/) for Worker code: the share-image route reads council portraits.
[assets]
binding = "ASSETS"

[placement]
mode = "smart"

[ai]
binding = "AI"

# Global second tier for public data caches (read when the per-datacenter cache misses).
# Pooled Postgres for the typed SQL path (app/db, docs/db-sql-path.md): "langford-db", pointed at the
# Supavisor session-mode pooler. Hyperdrive keeps connections warm between requests. For local dev, set
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE to the same URL (never commit it).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "2565758ad7ea4f688af2fe635eb26cf9"

[[kv_namespaces]]
binding = "PUBLIC_CACHE"
id = "723e71f9a2b249aab101970d0be104e1"

[vars]
AI_GATEWAY_ID = "langford-open-a-i"
# Shared daily generation attempts; resets at midnight America/Vancouver. 0 disables AI search.
AI_SEARCH_DAILY_LIMIT = "1000"
# Signup kill switch; Supabase restrictions still apply.
ENABLE_SIGNUPS = "true"
# Public signup discovery stays enabled.
PUBLIC_SIGNUP_LINKS = "true"
# UI readiness and scheduled dispatch remain off until approved rollout/testing.
EMAIL_ALERTS_AVAILABLE = "true"
EMAIL_ALERT_DISPATCH_ENABLED = "true"
# Worker-side enqueue cutoff (YYYY-MM-DD, match Edge ALERT_START_DATE). Empty disables enqueue.
EMAIL_ALERT_START_DATE = "2026-10-29"
# Contact-form notifications also go here (on top of ADMIN_EMAILS, without making it an admin login). Mail to
# openlangford.ca is posted to a private Discord channel by apps/email-router.
CONTACT_ALSO_NOTIFY = "admin@openlangford.ca"
# Discord meeting digests (issue #67). Global pause: only "true" posts. The webhook is the
# DISCORD_WEBHOOK_URL Worker secret; eligibility reuses EMAIL_ALERT_START_DATE.
DISCORD_POSTS_ENABLED = "false"
# New reader reports go to the moderators' Discord channel: the DISCORD_REPORTS_WEBHOOK_URL Worker secret (unset: no posts).
AI_PROVIDER = "openai"
AI_MODEL = "gpt-6-luna"
# Staff page checks (services/page-check.server.ts) read pages on a stronger model.
REVIEW_AI_MODEL = "gpt-6.1-terra"
# Topic summaries the fix agent rewrites (services/topic-summaries.server.ts), on the pipeline's writing model.
WRITING_AI_MODEL = "gpt-6.1-terra"
# No VIMEO_PROXY_URL / VIMEO_PROXY_FALLBACK_URL: Langford's video provider is eSCRIBE (ISI Live).
# A Vimeo deployment sets them here or in source_config.video_source.proxy_url / proxy_fallback_url.
VITE_SUPABASE_URL = "https://zxcvifwkaxtdfpanlwtl.supabase.co"
VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY = "sb_publishable_KL1VPqvqcoPOgLqCG2o-Mw_n4htEdbc"
VITE_POSTHOG_KEY = "phc_qfeuUwiF7HDB6c86rVFLpHSN8iZ9G79FQDVhYiVyBceg"
# PostHog project the site reports to; the admin overview reads visitors from it (with the POSTHOG_PERSONAL_API_KEY secret).
POSTHOG_PROJECT_ID = "675253"
# Images (report pictures, meeting posters, share cards) are served from R2. The r2.dev URL below is a
# rate-limited dev URL with no CDN caching. Once the custom domain exists (docs/images-cdn.md), uncomment
# DOCUMENT_IMAGE_CDN_BASE_URL; it takes precedence and stored r2.dev URLs are rewritten to it at read time.
DOCUMENT_IMAGE_CDN_BASE_URL = "https://images.openlangford.ca/viewroyal-document-images"
DOCUMENT_IMAGE_PUBLIC_BASE_URL = "https://pub-62dc9711e31a49c39b0544c981bf613e.r2.dev/viewroyal-document-images"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true

# Lightweight official-calendar sync, at 00:17 and 12:17 UTC.
[triggers]
crons = ["17 */12 * * *", "*/5 * * * *"]
